name: Reproduce exact analysis
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e .
      - run: python scripts/run_exact.py
      - uses: actions/upload-artifact@v4
        with:
          name: exact-analysis-results
          path: results/exact/
