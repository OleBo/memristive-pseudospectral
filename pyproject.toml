[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memristive-pseudospectral"
version = "0.1.0"
description = "Reproducible pseudospectral and finite-time stability analysis of self-organizing memristive networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8", "pandas>=2.0"]

[project.scripts]
memristive-analysis = "memristive_pseudospectral.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
